name: Publish PR evidence

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Only default-branch publisher code runs with write access. The artifact
      # contains data; no PR script or generated HTML is executed here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - name: Check evidence producer eligibility
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/publish-pr-evidence.ts preflight
      - uses: actions/download-artifact@v4
        if: steps.producer.outputs.publish == 'true'
        with:
          name: pr-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Publish current-head evidence
        if: steps.producer.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/publish-pr-evidence.ts evidence
