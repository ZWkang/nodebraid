name: PR Feedback Events

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
  check_suite:
    types: [completed]
  status:
permissions: {}

jobs:
  signal:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Completion wakes the main-branch controller after this PR check has ended.
      - name: Signal that PR metadata changed
        run: echo "PR feedback event received ($GITHUB_EVENT_NAME)."
