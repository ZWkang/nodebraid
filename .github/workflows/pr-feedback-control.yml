name: PR Feedback Control

on:
  workflow_run:
    workflows: [PR Feedback Events, Checks, Agent PR Feedback]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-feedback-control
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: agent-publish
    steps:
      # This privileged controller never executes PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.19
      - name: Reconcile all managed PRs and dispatch repairs
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_PR_TOKEN: ${{ secrets.AGENT_PR_TOKEN }}
        run: bun scripts/pr-feedback.ts control
