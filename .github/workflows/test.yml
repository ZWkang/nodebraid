name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - uses: github/gh-aw/actions/setup-cli@c35393777e5604a63721d09512263b1383301d4f
        with:
          version: v0.89.21
      - run: bun run agents:check
      - run: bunx agent-browser install --with-deps
      - run: bun run check
